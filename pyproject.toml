[project]
name = "parsehub"
version = "2.4.2"
description = "轻量、异步、开箱即用的社交媒体聚合解析库"
readme = "README.md"
requires-python = ">=3.12.0"
authors = [
    { name = "梓澪", email = "zilingmio@gmail.com" }
]
license = { text = "MIT" }
keywords = ["parser", "video-downloader", "social-media", "crawler", "parsehub"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "aiofiles>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "loguru>=0.7.3",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "urlextract>=1.10.0",
    "yt-dlp[default]>=2026.11.4.232659.dev0",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "markdownify>=1.2.3",
    "markdown>=3.11.3",
    "json5>=0.17.3",
    "requests>=2.34.2",
    "httpx[socks]>=0.28.1",
    "pillow>=13.0.0",
    "python-slugify[unidecode]>=9.1.3",
    "opencv-python-headless>=5.0.0.93",
    "cryptography>=50.0.2",
    "gmssl>=3.2.2",
    "signerpy>=0.12.0",
    "curl-cffi>=0.17.0",
    "xhshow>=0.2.0",
]

[project.scripts]
parsehub = "parsehub.cli:main"
ph = "parsehub.cli:main"

[project.optional-dependencies]
cli = [
    "argcomplete>=3.7.2",
    "platformdirs>=4.14.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parsehub"]

[project.urls]
Repository = "https://github.com/z-mio/parsehub"
Issues = "https://github.com/z-mio/parsehub/issues"

[tool.ruff]
line-length = 120
exclude = ["test/_*.py"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle 错误检查
    "W", # pycodestyle 警告检查
    "F", # pyflakes 错误检查
    "I", # isort 导入排序
    "B", # flake8-bugbear 常见错误检查
    "C4", # flake8-comprehensions 列表/字典推导式检查
    "UP", # pyupgrade 自动升级语法
]
ignore = [
    "B008", # 不在参数默认值中执行函数调用
    "C901", # 函数复杂度过高
]

[tool.mypy]
python_version = "3.12"
files = ["./"]
exclude = ["test"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths =  ["test"]
pythonpath = ["src"]
python_files = ["test_*.py"]
